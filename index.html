
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatly</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f4fb;
      color: #20263a;
    }
    header {
      background: #4263eb;
      color: white;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { margin: 0; font-size: 25px; }
    main {
      max-width: 720px;
      margin: 30px auto;
      padding: 0 14px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 5px 24px #18244a12;
      margin-bottom: 18px;
    }
    h2 { margin-top: 0; }
    input, button {
      font: inherit;
      padding: 12px;
      border-radius: 9px;
    }
    input {
      width: 100%;
      border: 1px solid #d8ddec;
      margin: 6px 0 12px;
    }
    button {
      border: 0;
      background: #4263eb;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .secondary { background: #e9edff; color: #304ac0; }
    .hidden { display: none !important; }
    .muted { color: #68718a; font-size: 14px; }
    #messages {
      height: 360px;
      overflow-y: auto;
      background: #f7f8fc;
      border-radius: 12px;
      padding: 12px;
      margin: 16px 0;
    }
    .message {
      background: white;
      border: 1px solid #e8ebf4;
      padding: 10px 12px;
      border-radius: 12px;
      margin: 8px 0;
      overflow-wrap: anywhere;
    }
    .message strong { color: #4263eb; }
    .message time { color: #858da1; font-size: 12px; }
    #sendForm { display: flex; gap: 8px; }
    #sendForm input { margin: 0; flex: 1; min-width: 0; }
    #status { margin-top: 12px; white-space: pre-wrap; }
    @media (max-width: 480px) {
      main { margin-top: 16px; }
      .card { padding: 16px; }
      #messages { height: 50vh; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Chatly 💬</h1>
    <button id="logout" class="secondary hidden">Sign out</button>
  </header>

  <main>
    <section id="authCard" class="card">
      <h2>Welcome to Chatly</h2>
      <p class="muted">Sign in or create an account to join the chat.</p>

      <form id="authForm">
        <label for="name">Display name (for new accounts)</label>
        <input id="name" maxlength="40" placeholder="Your name"
               autocomplete="nickname">

        <label for="email">Email address</label>
        <input id="email" type="email" required
               autocomplete="email" placeholder="you@example.com">

        <label for="password">Password</label>
        <input id="password" type="password" required minlength="6"
               autocomplete="current-password" placeholder="At least 6 characters">

        <button type="submit" id="loginButton">Sign in</button>
        <button type="button" id="registerButton" class="secondary">
          Create account
        </button>
      </form>
      <p id="authStatus" class="muted" role="status"></p>
    </section>

    <section id="chatCard" class="card hidden">
      <h2>Community chat</h2>
      <p class="muted">
        Signed in as <strong id="currentUser"></strong>.
        Messages are visible to all signed-in Chatly users.
      </p>
      <div id="messages" aria-live="polite"></div>
      <form id="sendForm">
        <input id="messageInput" maxlength="1000" required
               placeholder="Write a message..." autocomplete="off">
        <button id="sendButton" type="submit">Send</button>
      </form>
      <p id="chatStatus" class="muted" role="status"></p>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import {
      getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
      signInWithEmailAndPassword, signOut, updateProfile
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDoc,
  getDocs,
  doc,
  setDoc,
  updateDoc,
  query,
  where,
  orderBy,
  limit,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyCT-eai87fgaRtcQmcoMTw7nr9AX9BwEwE",
      authDomain: "chatly-2b761.firebaseapp.com",
      projectId: "chatly-2b761",
      storageBucket: "chatly-2b761.firebasestorage.app",
      messagingSenderId: "314821097344",
      appId: "1:314821097344:web:472ff0497b81f0b86f3365",
      measurementId: "G-T81LRRP7PW"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = id => document.getElementById(id);
    let unsubscribeMessages = null;
    let busy = false;

    function showStatus(id, message) {
      $(id).textContent = message;
    }

    function readableError(error) {
      const messages = {
        "auth/email-already-in-use": "That email already has an account. Try signing in.",
        "auth/invalid-email": "Please enter a valid email address.",
        "auth/weak-password": "Use a password with at least 6 characters.",
        "auth/invalid-credential": "Email or password is incorrect.",
        "auth/too-many-requests": "Too many attempts. Please wait and try again.",
        "permission-denied": "Firebase denied this action. Check your Firestore rules.",
        "unavailable": "Firebase is temporarily unavailable. Try again."
      };
      return messages[error.code] || error.message || "Something went wrong.";
    }

    async function withBusy(buttonIds, task) {
      if (busy) return;
      busy = true;
      buttonIds.forEach(id => $(id).disabled = true);
      try {
        await task();
      } catch (error) {
        console.error(error);
        showStatus(
          auth.currentUser ? "chatStatus" : "authStatus",
          readableError(error)
        );
      } finally {
        busy = false;
        buttonIds.forEach(id => $(id).disabled = false);
      }
    }

    $("authForm").addEventListener("submit", event => {
      event.preventDefault();
      withBusy(["loginButton", "registerButton"], async () => {
        showStatus("authStatus", "Signing in...");
        await signInWithEmailAndPassword(
          auth, $("email").value.trim(), $("password").value
        );
        showStatus("authStatus", "");
      });
    });

    $("registerButton").addEventListener("click", () => {
      withBusy(["loginButton", "registerButton"], async () => {
        const name = $("name").value.trim();
        const email = $("email").value.trim();
        const password = $("password").value;

        if (!name) {
          showStatus("authStatus", "Please enter a display name first.");
          return;
        }
        if (password.length < 6) {
          showStatus("authStatus", "Your password must be at least 6 characters.");
          return;
        }

        showStatus("authStatus", "Creating your account...");
        const result = await createUserWithEmailAndPassword(
          auth, email, password
        );
        await updateProfile(result.user, { displayName: name });
        showStatus("authStatus", "");
      });
    });

    $("logout").addEventListener("click", async () => {
      await signOut(auth);
    });

    function startChat(user) {
      $("authCard").classList.add("hidden");
      $("chatCard").classList.remove("hidden");
      $("logout").classList.remove("hidden");
      $("currentUser").textContent = user.displayName || user.email;
      showStatus("chatStatus", "Connecting to messages...");

      if (unsubscribeMessages) unsubscribeMessages();

      const messagesQuery = query(
        collection(db, "messages"),
        orderBy("createdAt", "desc"),
        limit(100)
      );

      unsubscribeMessages = onSnapshot(messagesQuery, snapshot => {
        const container = $("messages");
        container.replaceChildren();

        const docs = snapshot.docs.reverse();
        for (const messageDoc of docs) {
          const data = messageDoc.data();
          const article = document.createElement("div");
          article.className = "message";

          const heading = document.createElement("strong");
          heading.textContent = data.name || "Chatly user";

          const body = document.createElement("div");
          body.textContent = data.text || "";

          const time = document.createElement("time");
          if (data.createdAt) {
            time.textContent = " · " +
              data.createdAt.toDate().toLocaleString();
          }

          article.append(heading, body, time);
          container.appendChild(article);
        }

        container.scrollTop = container.scrollHeight;
        showStatus("chatStatus", "");
      }, error => {
        console.error(error);
        showStatus("chatStatus", readableError(error));
      });
    }

    $("sendForm").addEventListener("submit", event => {
      event.preventDefault();
      withBusy(["sendButton"], async () => {
        const user = auth.currentUser;
        const text = $("messageInput").value.trim();
        if (!user || !text) return;

        showStatus("chatStatus", "Sending...");
        await addDoc(collection(db, "messages"), {
          text,
          uid: user.uid,
          name: user.displayName || user.email,
          createdAt: serverTimestamp()
        });
        $("messageInput").value = "";
        showStatus("chatStatus", "");
      });
    });

onAuthStateChanged(auth, user => {
  if (user) {
    startChat(user);
    loadGroups();
      } else {
        if (unsubscribeMessages) unsubscribeMessages();
        unsubscribeMessages = null;
        $("chatCard").classList.add("hidden");
        $("authCard").classList.remove("hidden");
        $("logout").classList.add("hidden");
        showStatus("authStatus", "");
      }
    });


    // ===== CHATLY GROUPS =====

    let selectedGroupId = null;
    let stopGroupMessages = null;

    const groupStatus = document.getElementById("groupStatus");
    const groupsList = document.getElementById("groupsList");
    const selectedGroup = document.getElementById("selectedGroup");
    const groupMessages = document.getElementById("groupMessages");
    const joinRequests = document.getElementById("joinRequests");

    function groupNotice(message) {
      groupStatus.textContent = message;
    }

    async function loadGroups() {
      if (!auth.currentUser) return;

      try {
        const q = query(
          collection(db, "groups"),
          where("discoverable", "==", true),
          orderBy("createdAt", "desc")
        );

        const result = await getDocs(q);
        groupsList.replaceChildren();

        result.forEach(groupDoc => {
          const group = groupDoc.data();
          const card = document.createElement("div");
          const title = document.createElement("h3");
          const description = document.createElement("p");
          const button = document.createElement("button");

          title.textContent = group.name;
          description.textContent = group.description || "";
          button.textContent = "Request to join";

          button.addEventListener("click", async () => {
            try {
              const user = auth.currentUser;
              if (!user) return;

              const memberRef = doc(
                db, "groups", groupDoc.id, "members", user.uid
              );
              const member = await getDoc(memberRef);

              if (member.exists()) {
                await openGroup(groupDoc.id, group.name);
                return;
              }

              const requestRef = doc(
                db, "groups", groupDoc.id, "requests", user.uid
              );

              await setDoc(requestRef, {
                uid: user.uid,
                status: "pending",
                createdAt: serverTimestamp()
              });

              groupNotice("Join request sent!");
            } catch (error) {
              groupNotice("Request failed: " + error.message);
            }
          });

          card.append(title, description, button);
          groupsList.append(card);
        });
      } catch (error) {
        groupNotice("Couldn't load groups: " + error.message);
      }
    }

    document.getElementById("createGroupForm")
      .addEventListener("submit", async event => {
        event.preventDefault();

        const user = auth.currentUser;
        if (!user) {
          groupNotice("Please sign in first.");
          return;
        }

        const name = document.getElementById("groupName")
          .value.trim();
        const description = document.getElementById("groupDescription")
          .value.trim();

        if (!name || name.length > 50 || description.length > 200) {
          groupNotice("Check the group name and description.");
          return;
        }

try {
  groupNotice("Step 1: Creating group document...");
            name,
            description,
            discoverable: true,
            createdBy: user.uid,
            createdAt: serverTimestamp()
          });

          await setDoc(
            doc(db, "groups", groupRef.id, "members", user.uid),
            {
              uid: user.uid,
              role: "owner",
              joinedAt: serverTimestamp()
            }
          );

          document.getElementById("createGroupForm").reset();
          groupNotice("Group created!");
          await loadGroups();
          await openGroup(groupRef.id, name);
        } catch (error) {
          groupNotice("Couldn't create group: " + error.message);
        }

          groupNotice("Step 1 succeeded. Step 2: Adding owner membership...");
    
      });

    async function openGroup(groupId, groupName) {
      const user = auth.currentUser;
      if (!user) return;

      const memberRef = doc(
        db, "groups", groupId, "members", user.uid
      );
      const member = await getDoc(memberRef);

      if (!member.exists()) {
        groupNotice("You must be approved to enter this group.");
        return;
      }

      selectedGroupId = groupId;
      selectedGroup.textContent = groupName;
      groupMessages.replaceChildren();

      if (stopGroupMessages) stopGroupMessages();

      const q = query(
        collection(db, "groups", groupId, "messages"),
        orderBy("createdAt", "asc")
      );

      stopGroupMessages = onSnapshot(q, snapshot => {
        groupMessages.replaceChildren();

        snapshot.forEach(messageDoc => {
          const message = messageDoc.data();
          const line = document.createElement("p");
          line.textContent =
            (message.name || "Chatly user") + ": " + message.text;
          groupMessages.append(line);
        });
      }, error => {
        groupNotice("Message error: " + error.message);
      });

      await loadJoinRequests(groupId);
    }

    document.getElementById("groupMessageForm")
      .addEventListener("submit", async event => {
        event.preventDefault();

        const user = auth.currentUser;
        const input = document.getElementById("groupMessageText");
        const text = input.value.trim();

        if (!user || !selectedGroupId || !text || text.length > 1000) {
          return;
        }

        try {
          await addDoc(
            collection(db, "groups", selectedGroupId, "messages"),
            {
              uid: user.uid,
              name: user.displayName || "Chatly user",
              text,
              createdAt: serverTimestamp()
            }
          );

          input.value = "";
          groupNotice("");
        } catch (error) {
          groupNotice("Couldn't send message: " + error.message);
        }
      });

    async function loadJoinRequests(groupId) {
      joinRequests.replaceChildren();

      const user = auth.currentUser;
      if (!user) return;

      const groupSnap = await getDoc(doc(db, "groups", groupId));

      if (!groupSnap.exists() ||
          groupSnap.data().createdBy !== user.uid) {
        return;
      }

      const q = query(
        collection(db, "groups", groupId, "requests"),
        where("status", "==", "pending")
      );

      const result = await getDocs(q);
      const heading = document.createElement("h3");
      heading.textContent = "Pending join requests";
      joinRequests.append(heading);

      result.forEach(requestDoc => {
        const request = requestDoc.data();
        const row = document.createElement("div");
        const label = document.createElement("span");
        const approve = document.createElement("button");

        label.textContent = "A user wants to join";
        approve.textContent = "Approve";

        approve.addEventListener("click", async () => {
          try {
            const latestGroup = await getDoc(doc(db, "groups", groupId));

            if (!auth.currentUser ||
                !latestGroup.exists() ||
                latestGroup.data().createdBy !== auth.currentUser.uid) {
              throw new Error("Only the group owner can approve requests.");
            }

            await updateDoc(requestDoc.ref, {
              status: "approved"
            });

            await setDoc(
              doc(db, "groups", groupId, "members", request.uid),
              {
                uid: request.uid,
                role: "member",
                joinedAt: serverTimestamp()
              }
            );

            groupNotice("Member approved!");
            await loadJoinRequests(groupId);
          } catch (error) {
            groupNotice("Approval failed: " + error.message);
          }
        });

        row.append(label, approve);
        joinRequests.append(row);
      });
    }
    
  </script>


<section id="groupsSection">
  <h2>Discover groups</h2>
  <p>Create a group or request to join one.</p>

  <form id="createGroupForm">
    <input id="groupName" placeholder="Group name" maxlength="50" required>
    <input id="groupDescription" placeholder="Group description" maxlength="200">
    <button type="submit">Create group</button>
  </form>

  <p id="groupStatus"></p>
  <div id="groupsList"></div>

  <h3>Selected group</h3>
  <div id="selectedGroup"></div>

  <h3>Group messages</h3>
  <div id="groupMessages"></div>

  <form id="groupMessageForm">
    <input id="groupMessageText" placeholder="Write a message..." maxlength="1000" required>
    <button type="submit">Send</button>
  </form>

  <div id="joinRequests"></div>
</section>

  
</body>
</html>
